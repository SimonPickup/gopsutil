name: Test

on:
  push:
    branches:
      - master
      - feature/syncthing-v2
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: macOS ARM / Go 1.26.9
    runs-on: macos-26
    timeout-minutes: 15
    env:
      # Match the consuming app's release compiler; never auto-upgrade it.
      GOTOOLCHAIN: local
    steps:
      - name: Checkout public fork
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install release Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.9'
          check-latest: false
          cache: false
      - name: Verify toolchain and runner
        run: |
          test "$(go env GOVERSION)" = go1.26.9
          test "$(go env GOOS)/$(go env GOARCH)" = darwin/arm64
      - name: Test public fork
        run: go test -race -timeout 10m ./...
